{% extends 'base.html' %}
{% block title %}{{page_title}}{% endblock %}
{% block content %}
{% if message %}
  <p>message: {{message}}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{form}}
    <button type="submit">Log In</button>
    Don't have an account yet? <a href="{%url 'users:signup'%}">Sign Up</a>
</form>
{% endblock %}
